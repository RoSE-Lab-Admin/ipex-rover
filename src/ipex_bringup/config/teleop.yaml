# Logitech F710 (X mode, joy_linux) hand-controller mapping for controller.py.
#
# Sticks           : tank drive (left stick Y = left side, right stick Y = right side)
# D-pad up/down    : max side speed +/- speed_step
# D-pad left/right : drum speed -/+ drum_rpm_step drum RPM (all drums, continuous)
# LB / LT          : rear arm up / down   (tap = step arm_step_deg, hold = jog)
# RB / RT          : front arm up / down  (tap = step arm_step_deg, hold = jog)
#                    Both up+down on one arm = stop; release both to resume.
# A                : HOME (CAL) all connected arms -- arms MOVE to limit switch
# B                : ALL STOP (/ipex/all_stop -> STOP to every Teensy; drive + drums zero)
# X                : EXCAVATION MODE on/off: drums spin up, both arms lower to the dig
#                    angle, rover crawls; D-pad / arm buttons / sticks become fine
#                    adjustments. X again: wheels stop, then drums; arms stay put.
#                    Ending with X saves each arm's angle, drum RPM and crawl speed
#                    (~/roxey_data/excavation_mode.yaml); the next X starts there.
# Y                : (mode off) reset the saved excavation settings to the defaults.
#                    Settings (excavate_*) are at the top of ipex_motion/controller.py.
#
# Units here: arms in degrees, drums in drum RPM (after the 80:1 gearbox).
# controller.py converts to SI (rad, rad/s at the drum) for ros2_control.
controller:
  ros__parameters:
    # Axes
    left_y_axis: 1
    right_y_axis: 4
    left_trigger_axis: 2
    right_trigger_axis: 5
    dpad_x_axis: 6          # +1 = left, -1 = right
    dpad_y_axis: 7          # +1 = up,   -1 = down

    # Buttons
    home_button: 0          # A
    all_stop_button: 1      # B
    excavate_button: 2      # X
    excavate_reset_button: 3  # Y
    left_bumper_button: 4
    right_bumper_button: 5

    # Trigger counts as pressed below this value (released = +1, full = -1).
    trigger_pressed_threshold: 0.0

    # Drive
    # Closed-loop (RoboClaw PID) speeds: these are real m/s at the wheel.
    # Motor top speed ~4.2 m/s (260 RPM, 0.155 m radius; firmware caps at
    # 8640 QPPS). D-pad steps ~10% .. ~83% of top speed.
    min_side_speed: 0.35    # m/s
    max_side_speed: 3.50    # m/s
    speed_step: 0.35        # m/s
    wheel_separation: 0.582 # m, must match diff_drive_controller

    # Drums, in drum RPM. 1 drum RPM = 400 x 80 / 60 = 533 motor steps/s.
    drum_rpm_step: 1.0               # per D-pad press
    drum_max_steps_s: 3200.0         # firmware DRUM_MAX_STEPS_S -> max 6.0 drum RPM
    drum_motor_steps_per_rev: 400.0  # firmware MOTOR_STEPS_PER_REV (arm.ino)
    drum_gear_ratio: 80.0            # motor : drum; must match drum_gear_ratio in ipex.ros2_control.xacro
    # Directions belong to the physical arm; swapped with the arm Teensy IDs on
    # 2026-10-22 so each physical drum keeps spinning the same way as before.
    # Rear flipped 2026-10-28 after the rear drum motor was rewired.
    front_drum_direction: -1.0
    rear_drum_direction: -1.0

    # Arms. Angle limits are enforced on the arm Teensy (ARM_MIN_DEG / ARM_MAX_DEG
    # in firmware/arm/arm.ino), so they are not duplicated here.
    arm_step_deg: 2.0       # Tap step (deg)
    hold_threshold_s: 0.3   # Held longer than this = jog; shorter = tap
