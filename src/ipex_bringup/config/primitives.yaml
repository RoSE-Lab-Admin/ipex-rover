# ipex_primitives/primitive_server
primitive_server:
  ros__parameters:
    # Arms (must match firmware/arm/arm.ino ARM_MIN_DEG / ARM_MAX_DEG)
    arm_min_deg: -40.0
    arm_max_deg: 45.0
    arm_speed_deg_s: 5.625        # default arm speed (= firmware default); set_arm restores it
    arm_speed_min_deg_s: 0.5      # must match firmware ARM_SPEED_MIN_DEG_S
    arm_speed_max_deg_s: 5.625    # must match firmware ARM_SPEED_MAX_DEG_S

    # Cut depth below the tire tread plane (the rubber between the grousers; no sinkage):
    #   depth = drum_cut_radius - (pivot_height + length*sin(angle))
    # Geometry must match teleop.yaml (depth hold in X mode).
    arm_pivot_height_m: 0.3208    # pivot above the tread: 0.3183 above base_link + 0.0025 (axle 0.1525, tread radius 0.155).
                                  # Rover check 2026-10-31: -28.7 deg = 1 cm below the tread, measured
    arm_length_m: 0.3786          # shoulder pivot to drum axle (ipex.xacro, both arms)
    drum_cut_radius_m: 0.149      # drum tooth-tip radius (drum meshes)
    arm_pivot_dist_m: 0.469       # far axle to the shoulder pivot, horizontal (ipex.xacro: 0.46875, both arms)

    # IMU pitch depth hold (excavate hold_depth: true; teleop X mode). Model and checks:
    # ipex_primitives/depth_hold.py. Must match teleop.yaml.
    # Hardware: firmware arm limits -40 / +45 deg; arm resolves ~0.009 deg/step
    # (400 steps x 100:1). Everything below is a chosen or estimated limit, not hardware:
    depth_hold_min_deg: -30.0           # lowest angle the hold commands (operator limit 2026-11-18; 1.75 cm below the tread)
    depth_hold_max_pitch_deg: 4.0       # estimate: |pitch change| over this = stop correcting (2.4 x 4 = 9.6 deg < the cap)
    depth_hold_max_correction_deg: 10.0 # estimate: |arm - dig angle| cap
    depth_hold_max_ratio: 3.0           # |correction| <= 3 x |pitch change|; geometry needs 1 + A/(L cos a) = 2.3-2.4 at -30..-10 deg
    depth_hold_brake_off: true          # arm Teensy hold mode while holding: brake released once, motors hold
                                        # (encoder closed loop; slip > 1 deg, no keepalive 0.5 s, STOP -> brake). false = brake cycles per move
    depth_hold_deadband_deg: 0.25       # estimate: ~0.1 deg of pitch; rejects IMU noise (use 0.5 with brake_off false)
    depth_hold_min_interval_s: 0.2      # estimate: retargets are free with the brake off (use 1.0 with brake_off false: ~0.45 s brake cycle per move)
    pitch_filter_tau_s: 0.3             # estimate (was 1.0, lagged ~3 s on the 2026-11-18 tilt check); tune from a dig bag's /imu/data
    imu_stale_s: 0.5                    # UM7 update_rate 60 Hz (um7.yaml) -> ~30 missed messages

    arm_tolerance_deg: 0.5       # "reached" when within this of the target
    arm_timeout_margin_s: 5.0     # added to travel time (brake release/engage, settle)

    # Drive
    max_speed_mps: 1.0            # primitives never command faster than this
    max_turn_rad_s: 1.0
    drive_timeout_factor: 1.5     # timeout = expected time x factor + margin
    drive_timeout_margin_s: 3.0
    stall_current_a: 8.5          # ACS712 drive current, /rover/<wheel>/current (RoboClaw limit is 9 A since 2026-11-13; keep 0.5 A under it)
    stall_time_s: 1.0             # at/above stall current this long -> STALL

    # Drums: primitive omega > 0 means "dig" (= hand controller D-pad right)
    # Signs belong to the physical arm; swapped with the Teensy IDs on 2026-10-22.
    # Rear flipped 2026-10-28 after the rear drum motor was rewired; both flipped
    # again 2026-10-28 after testbed runs showed the drums digging backwards.
    drum_dig_sign_front: -1.0
    drum_dig_sign_rear: -1.0
    drum_max_rad_s: 1.25664       # at the drum: 25600 motor steps/s (firmware cap, 1600/rev) / 80:1 = 12.0 drum RPM
    drum_skip_min_rpm: 3.0        # resonance stall band (drum RPM): drum speeds strictly inside are
    drum_skip_max_rpm: 6.0        # rejected (INVALID_PARAMS); must match teleop.yaml. min >= max = off
    drum_spinup_s: 1.0            # excavate: drums spin this long before the arms lower
    drum_stop_wait_s: 3.0         # on exit: wait (max) for odometry to show the wheels stopped...
    drum_stop_delay_s: 0.5        # ...then this long before the drums stop (drums stop last)

    # Energy
    idle_window_s: 2.0            # idle power = average power over this window before start
    energy_settle_s: 0.3

    # Run log: <data_dir>/runs/primitive_runs.csv
    data_dir: '~/roxey_data'
