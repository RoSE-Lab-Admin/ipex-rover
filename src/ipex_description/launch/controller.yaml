full_controller:
  # Publish all joint states -----------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  # Position Controllers --------------------------------------
  front_shoulder_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: front_shoulder_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
  front_left_drum_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: front_left_drum_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
  front_right_drum_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: front_right_drum_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
  front_left_wheel_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: front_left_wheel_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
  back_left_wheel_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: back_left_wheel_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
  front_right_wheel_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: front_right_wheel_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
  back_right_wheel_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: back_right_wheel_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
  back_shoulder_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: back_shoulder_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
  back_left_drum_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: back_left_drum_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
  back_right_drum_rev_position_controller:
    type: effort_controllers/JointPositionController
    joint: back_right_drum_rev
    pid: {p: 100.0, i: 0.01, d: 10.0}
