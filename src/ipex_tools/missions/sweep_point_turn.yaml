# ============================================================================
# Sweep: turn rate (5..50 deg/s) and turn angle (36..360 deg).
#
#   roxey mission sweep_point_turn --check     validate only (nothing moves)
#   roxey mission sweep_point_turn             run (records a bag)
#
# One parameter changes at a time; the others stay at their defaults.
# A 3 s idle follows every step so the next step's idle baseline
# (the 2 s before it starts) is clean.
#
# Before running: arms homed and up, about 1.5 x 1.5 m clear around the rover.
# Someone on the controller (B = all stop).
# About 9 minutes.
#
# Every left turn is followed by the same turn right, so the heading
# returns. Point turns can STALL on high-grip floors (7 A limit).
# ============================================================================

save_as:                # output folder name, e.g. arc_sweep_lab_oct21
                        # (empty = <date_time>_<name>; _2, _3 added if it exists)

name: sweep_point_turn
description: >
  Point turn rate and angle sweeps, left then right.
record: true
on_failure: stop

steps:
  - {primitive: idle, tag: baseline_start, params: {t_wait_s: 10}}

  # --- turn rate (90 deg each way) -------------------------------------------
  - {primitive: point_turn, tag: left_w5, params: {dpsi_deg: 90, omega_deg_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w5, params: {dpsi_deg: -90, omega_deg_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_w10, params: {dpsi_deg: 90, omega_deg_s: 10}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w10, params: {dpsi_deg: -90, omega_deg_s: 10}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_w15, params: {dpsi_deg: 90, omega_deg_s: 15}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w15, params: {dpsi_deg: -90, omega_deg_s: 15}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_w20, params: {dpsi_deg: 90, omega_deg_s: 20}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w20, params: {dpsi_deg: -90, omega_deg_s: 20}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_w25, params: {dpsi_deg: 90, omega_deg_s: 25}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w25, params: {dpsi_deg: -90, omega_deg_s: 25}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_w30, params: {dpsi_deg: 90, omega_deg_s: 30}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w30, params: {dpsi_deg: -90, omega_deg_s: 30}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_w35, params: {dpsi_deg: 90, omega_deg_s: 35}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w35, params: {dpsi_deg: -90, omega_deg_s: 35}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_w40, params: {dpsi_deg: 90, omega_deg_s: 40}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w40, params: {dpsi_deg: -90, omega_deg_s: 40}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_w45, params: {dpsi_deg: 90, omega_deg_s: 45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w45, params: {dpsi_deg: -90, omega_deg_s: 45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_w50, params: {dpsi_deg: 90, omega_deg_s: 50}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_w50, params: {dpsi_deg: -90, omega_deg_s: 50}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}

  # --- turn angle (17.2 deg/s) -----------------------------------------------
  - {primitive: point_turn, tag: left_a36, params: {dpsi_deg: 36, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a36, params: {dpsi_deg: -36, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_a72, params: {dpsi_deg: 72, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a72, params: {dpsi_deg: -72, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_a108, params: {dpsi_deg: 108, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a108, params: {dpsi_deg: -108, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_a144, params: {dpsi_deg: 144, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a144, params: {dpsi_deg: -144, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_a180, params: {dpsi_deg: 180, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a180, params: {dpsi_deg: -180, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_a216, params: {dpsi_deg: 216, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a216, params: {dpsi_deg: -216, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_a252, params: {dpsi_deg: 252, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a252, params: {dpsi_deg: -252, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_a288, params: {dpsi_deg: 288, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a288, params: {dpsi_deg: -288, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_a324, params: {dpsi_deg: 324, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a324, params: {dpsi_deg: -324, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: left_a360, params: {dpsi_deg: 360, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: point_turn, tag: right_a360, params: {dpsi_deg: -360, omega_deg_s: 17.2}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}

  - {primitive: idle, tag: baseline_end, params: {t_wait_s: 10}}
