  - {primitive: arc_turn, tag: back_v0.56, params: {r_arc_m: 1, speed_mps: -0.56, dpsi_deg: -45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: fwd_v0.64, params: {r_arc_m: 1, speed_mps: 0.64, dpsi_deg: 45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: back_v0.64, params: {r_arc_m: 1, speed_mps: -0.64, dpsi_deg: -45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: fwd_v0.72, params: {r_arc_m: 1, speed_mps: 0.72, dpsi_deg: 45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: back_v0.72, params: {r_arc_m: 1, speed_mps: -0.72, dpsi_deg: -45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: fwd_v0.8, params: {r_arc_m: 1, speed_mps: 0.8, dpsi_deg: 45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: back_v0.8, params: {r_arc_m: 1, speed_mps: -0.8, dpsi_deg: -45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}

  # --- turn angle (1.0 m radius, 0.2 m/s) ------------------------------------
  - {primitive: arc_turn, tag: fwd_a9, params: {r_arc_m: 1, speed_mps: 0.2, dpsi_deg: 9}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: back_a9, params: {r_arc_m: 1, speed_mps: -0.2, dpsi_deg: -9}}
