  - {primitive: arc_turn, tag: fwd_r1.9, params: {r_arc_m: 1.9, speed_mps: 0.2, dpsi_deg: 45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: back_r1.9, params: {r_arc_m: 1.9, speed_mps: -0.2, dpsi_deg: -45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: fwd_r2.1, params: {r_arc_m: 2.1, speed_mps: 0.2, dpsi_deg: 45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: back_r2.1, params: {r_arc_m: 2.1, speed_mps: -0.2, dpsi_deg: -45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}

  # --- speed (1.0 m radius, 45 deg) ------------------------------------------
