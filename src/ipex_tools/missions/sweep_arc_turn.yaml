  - {primitive: arc_turn, tag: back_v0.24, params: {r_arc_m: 1, speed_mps: -0.24, dpsi_deg: -45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: arc_turn, tag: fwd_v0.32, params: {r_arc_m: 1, speed_mps: 0.32, dpsi_deg: 45}}
