# ============================================================================
# Sweep: every sweep above in one run: arms, drums, drive, point turns, arcs.
#
#   roxey mission sweep_all --check     validate only (nothing moves)
#   roxey mission sweep_all             run (records a bag)
#
# One parameter changes at a time; the others stay at their defaults.
# A 3 s idle follows every step so the next step's idle baseline
# (the 2 s before it starts) is clean.
#
# Before running: arms homed (A or `roxey home`). Drums clear; about 2.5 x 2.5 m clear floor.
# Someone on the controller (B = all stop).
# About 18 minutes.
#
# Same steps and tags as sweep_set_arm, sweep_drums, sweep_drive_straight,
# sweep_point_turn and sweep_arc_turn, run back to back. Run those
# individually to repeat one sweep. Battery: ~30 min of mostly light load.
# ============================================================================

save_as:                # output folder name, e.g. arc_sweep_lab_oct21
                        # (empty = <date_time>_<name>; _2, _3 added if it exists)

name: sweep_all
description: >
  All parameter sweeps (arms, drums, drive, point turns, arcs) in one run.
record: true
on_failure: stop

steps:
  - {primitive: idle, tag: baseline_start, params: {t_wait_s: 10}}

  # --- sweep_set_arm: move down 8 deg at a time, hold 5 s --------------------
  - {primitive: set_arm, tag: arm_40, params: {arm: both, theta_deg: 40}}
  - {primitive: idle, tag: hold_40, params: {t_wait_s: 5}}
  - {primitive: set_arm, tag: arm_32, params: {arm: both, theta_deg: 32}}
  - {primitive: idle, tag: hold_32, params: {t_wait_s: 5}}
  - {primitive: set_arm, tag: arm_24, params: {arm: both, theta_deg: 24}}
  - {primitive: idle, tag: hold_24, params: {t_wait_s: 5}}
  - {primitive: set_arm, tag: arm_16, params: {arm: both, theta_deg: 16}}
  - {primitive: idle, tag: hold_16, params: {t_wait_s: 5}}
  - {primitive: set_arm, tag: arm_8, params: {arm: both, theta_deg: 8}}
  - {primitive: idle, tag: hold_8, params: {t_wait_s: 5}}
  - {primitive: set_arm, tag: arm_0, params: {arm: both, theta_deg: 0}}
  - {primitive: idle, tag: hold_0, params: {t_wait_s: 5}}
  - {primitive: set_arm, tag: arm_-8, params: {arm: both, theta_deg: -8}}
  - {primitive: idle, tag: hold_-8, params: {t_wait_s: 5}}
  - {primitive: set_arm, tag: arm_-16, params: {arm: both, theta_deg: -16}}
  - {primitive: idle, tag: hold_-16, params: {t_wait_s: 5}}
  - {primitive: set_arm, tag: arm_-24, params: {arm: both, theta_deg: -24}}
  - {primitive: idle, tag: hold_-24, params: {t_wait_s: 5}}
  - {primitive: set_arm, tag: arm_-32, params: {arm: both, theta_deg: -32}}
  - {primitive: idle, tag: hold_-32, params: {t_wait_s: 5}}

  # --- sweep_set_arm: return to home in one move -----------------------------
  - {primitive: set_arm, tag: arm_return_full, params: {arm: both, theta_deg: 45}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}

  # --- sweep_drums: drum speed, dig direction (250..2500 steps/s) ------------
  - {primitive: excavate, tag: dig_drum_250, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 250, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: excavate, tag: dig_drum_500, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 500, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: excavate, tag: dig_drum_750, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 750, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: excavate, tag: dig_drum_1000, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 1000, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: excavate, tag: dig_drum_1250, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 1250, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: excavate, tag: dig_drum_1500, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 1500, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: excavate, tag: dig_drum_1750, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 1750, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: excavate, tag: dig_drum_2000, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 2000, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: excavate, tag: dig_drum_2250, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 2250, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: excavate, tag: dig_drum_2500, params: {arm: both, dig_angle_deg: 45, speed_mps: 0, drum_steps_s: 2500, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}

  # --- sweep_drums: drum speed, dump direction (3 points) --------------------
  - {primitive: deposit, tag: dump_drum_500, params: {arm: both, dump_angle_deg: 45, speed_mps: 0, drum_steps_s: 500, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: deposit, tag: dump_drum_1250, params: {arm: both, dump_angle_deg: 45, speed_mps: 0, drum_steps_s: 1250, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
  - {primitive: deposit, tag: dump_drum_2000, params: {arm: both, dump_angle_deg: 45, speed_mps: 0, drum_steps_s: 2000, duration_s: 5}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}

  # --- sweep_drive_straight: speed (1 m each way) ----------------------------
  - {primitive: drive_straight, tag: fwd_v0.08, params: {distance_m: 1, speed_mps: 0.08}}
  - {primitive: idle, tag: gap, params: {t_wait_s: 3}}
